  gold_sql: SELECT COUNT(*) FROM movies m WHERE m.year BETWEEN 1980 AND 1989 AND EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = m.movie_id AND g.genre = 'Horror') AND EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = m.movie_id AND g.genre = 'Comedy')
