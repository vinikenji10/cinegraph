  question: Qual é a média de todas as avaliações dadas a filmes de animação?
  compare: scalar
  gold_sql: SELECT ROUND(AVG(r.rating), 2) FROM ratings r WHERE EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = r.movie_id AND g.genre = 'Animation')
