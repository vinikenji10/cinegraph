- id: S13
  category: sql
  question: Em que ano foram lançados mais filmes do acervo?
  compare: scalar
  gold_sql: SELECT year, COUNT(*) AS n FROM movies WHERE year IS NOT NULL GROUP BY year ORDER BY n DESC, year LIMIT 1
