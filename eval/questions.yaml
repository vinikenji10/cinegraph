# Conjunto de perguntas de teste do CineGraph (rascunho para revisão do grupo).
#
# category / expected_route:
#   sql      -> perguntas objetivas; gold_sql é a resposta de referência
#   semantic -> tema, atmosfera ou semelhança; intent orienta o juiz de relevância
#   mixed    -> critério subjetivo + filtros objetivos; constraints são verificadas no banco
#   outro    -> fora do escopo
#
# compare (só sql):
#   ordered -> lista de movie_id na ordem (rankings)
#   scalar  -> o primeiro valor da primeira linha do gold precisa aparecer na resposta
#
# Convenções do gold (as mesmas do prompt de SQL): "mais bem avaliados" ordena por
# bayes_rating; "mais populares" por n_ratings; desempate por movie_id.

- id: S01
  category: sql
  question: Quais são os 5 filmes de ação mais bem avaliados?
  compare: ordered
  gold_sql: SELECT m.movie_id FROM movies m WHERE EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = m.movie_id AND g.genre = 'Action') ORDER BY m.bayes_rating DESC, m.movie_id LIMIT 5
- id: S02
  category: sql
  question: Quais são os 10 filmes mais populares do acervo, com mais avaliações?
  compare: ordered
  gold_sql: SELECT m.movie_id FROM movies m ORDER BY m.n_ratings DESC, m.movie_id LIMIT 10
- id: S03
  category: sql
  question: Quantos filmes de terror existem no acervo?
  compare: scalar
  gold_sql: SELECT COUNT(*) FROM movie_genres WHERE genre = 'Horror'
- id: S04
  category: sql
  question: Quantos filmes de animação foram lançados nos anos 2000?
  compare: scalar
  gold_sql: SELECT COUNT(*) FROM movies m WHERE m.year BETWEEN 2000 AND 2009 AND EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = m.movie_id AND g.genre = 'Animation')
- id: S05
  category: sql
  question: Qual é a nota média de Pulp Fiction?
  compare: scalar
  gold_sql: SELECT ROUND(avg_rating, 2) FROM movies WHERE movie_id = 296
- id: S06
  category: sql
  question: Quais são os 5 dramas mais bem avaliados lançados antes de 1970?
  compare: ordered
  gold_sql: SELECT m.movie_id FROM movies m WHERE m.year < 1970 AND EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = m.movie_id AND g.genre = 'Drama') ORDER BY m.bayes_rating DESC, m.movie_id LIMIT 5
- id: S07
  category: sql
  question: Me dê o top 5 de ficção científica lançada depois de 2010, pela nota.
  compare: ordered
  gold_sql: SELECT m.movie_id FROM movies m WHERE m.year > 2010 AND EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = m.movie_id AND g.genre = 'Sci-Fi') ORDER BY m.bayes_rating DESC, m.movie_id LIMIT 5
- id: S08
  category: sql
  question: Quantas avaliações o acervo tem no total?
  compare: scalar
  gold_sql: SELECT COUNT(*) FROM ratings
- id: S09
  category: sql
  question: Qual é a nota média de todas as avaliações do acervo?
  compare: scalar
  gold_sql: SELECT ROUND(AVG(rating), 2) FROM ratings
- id: S10
  category: sql
  question: Quantas avaliações Forrest Gump recebeu?
  compare: scalar
  gold_sql: SELECT n_ratings FROM movies WHERE movie_id = 356
- id: S11
  category: sql
  question: Quais são os 3 faroestes mais bem avaliados?
  compare: ordered
  gold_sql: SELECT m.movie_id FROM movies m WHERE EXISTS (SELECT 1 FROM movie_genres g WHERE g.movie_id = m.movie_id AND g.genre = 'Western') ORDER BY m.bayes_rating DESC, m.movie_id LIMIT 3
- id: S12
