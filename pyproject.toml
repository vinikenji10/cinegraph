[project]
name = "cinegraph"
version = "0.1.0"
description = "CineGraph: chatbot híbrido (Text-to-SQL + busca vetorial) para recomendação de filmes — PTC3567"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "langgraph>=0.6",
    "pydantic>=2.8",
    "sqlglot>=25",
    "fastembed>=0.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.9",
]

[project.scripts]
cinegraph = "cinegraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["needs_data: precisa do banco e do índice gerados (cinegraph download/build-db/build-index)"]
